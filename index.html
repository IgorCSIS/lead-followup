<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070E18" />
    <title>Lead Follow-up | Same-day drafts from a lead CSV</title>
    <meta
      name="description"
      content="Turn a lead CSV into same-day SMS and email follow-up drafts. Runs entirely in your browser. No account, no API keys, nothing uploaded."
    />
    <link rel="icon" type="image/svg+xml" href="/lead-followup/favicon.svg" />
    <!--
      No web fonts on purpose. The page claims a homeowner's details never
      leave the browser, and a font request would still be a request going out
      while that list is open. System fonts make the claim literally true: once
      the page is loaded it makes no network calls at all.
    -->
  </head>
  <body class="bg-ink-950 text-sand-200 antialiased">
    <div id="app"></div>
    <noscript>
      <div
        style="
          max-width: 34rem;
          margin: 4rem auto;
          padding: 0 1.25rem;
          font-family: system-ui, sans-serif;
          line-height: 1.6;
        "
      >
        <h1 style="font-size: 1.5rem; margin: 0 0 0.75rem">This tool needs JavaScript</h1>
        <p style="margin: 0 0 1rem; color: #b8bfcc">
          That is not a tracking script. The whole tool runs in your browser, which is how your
          lead list stays on your own machine instead of being uploaded to a server. With
          JavaScript off there is nothing left to do the work.
        </p>
        <p style="margin: 0; color: #b8bfcc">
          Turn JavaScript on for this page, or run the command line version:
          <code style="color: #f0a868">python tools/lead_followup_drafter.py</code>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
