name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; nothing here can write to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should win, but never cancel a deploy that is already applying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests and parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: TypeScript tests
        run: npm run test:ts

      - name: Python tests
        run: npm run test:py

      # The CLI and the web app have to say exactly the same thing. This
      # fails the build if a template is changed in one and not the other.
      - name: Draft parity between TypeScript and Python
        run: npm run parity

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
